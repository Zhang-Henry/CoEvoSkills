services:
  main:
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Dockerfile
    image: ${MAIN_IMAGE_NAME}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - TEST_DIR=${TEST_DIR}
      - HVAC_SIMULATOR_URL=http://simulator:8080
    volumes:
      - ${HOST_VERIFIER_LOGS_PATH}:${ENV_VERIFIER_LOGS_PATH}
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
    depends_on:
      simulator:
        condition: service_healthy
    networks:
      - task-net
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY}

  simulator:
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Dockerfile.simulator
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - task-net

networks:
  task-net:
    driver: bridge
